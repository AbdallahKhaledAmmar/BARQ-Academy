name: BARQ Assessment CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up config/app.env for CI
        run: |
          mkdir -p config
          cat > config/app.env << 'ENVEOF'
          DATABASE_URL=postgresql://barq_app:BarqLabOnly_7qN2vK8c@postgres:5432/barq_tasks
          REDIS_URL=redis://redis:6379/0
          ENVEOF
          echo "Created config/app.env for CI (synthetic lab credential, matches docker-compose.yml)."

      - name: Check docker compose config syntax
        run: |
          docker compose config > /dev/null
          echo "docker-compose.yml syntax is valid."

      - name: Build all images
        run: docker compose build

      - name: Start the environment
        run: docker compose up -d

      - name: Wait for the environment to become ready
        run: |
          echo "Waiting up to 60 seconds for http://localhost:8080/ready ..."
          waited=0
          max_wait=60
          until curl -s -f http://localhost:8080/ready > /dev/null; do
            if [ "$waited" -ge "$max_wait" ]; then
              echo "Environment did not become ready within ${max_wait}s"
              docker compose ps
              docker compose logs
              exit 1
            fi
            sleep 2
            waited=$((waited + 2))
            echo "  waited ${waited}s..."
          done
          echo "Environment is ready."

      - name: Show running containers
        run: docker compose ps

      - name: Run validate.sh
        run: |
          chmod +x validate.sh
          ./validate.sh

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose ps
          echo "=== docker compose logs ==="
          docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down -v
